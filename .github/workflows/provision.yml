name: Provision

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: platform-provision-state

jobs:
  provision:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      github.event.pull_request.number != 132 ||
      github.event.pull_request.head.ref != 'dev' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: pulumi/actions@v7
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL: ${{ secrets.EMAIL }}
          OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.REGION }}
          OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.USER_OCID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_KEY }}
          PULUMI_FALLBACK_TO_STATE_SECRETS_MANAGER: "true"
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        with:
          command: preview
          stack-name: main
          pulumi-version: 3.276.0
          upsert: true

  # One-time state reconciliation; remove immediately after a successful run.
  reconcile-state:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.number == 132 &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EMAIL: ${{ secrets.EMAIL }}
      OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.REGION }}
      OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.USER_OCID }}
      PULUMI_BACKEND_URL: s3://platform-state?endpoint=cnm7patunz1z.compat.objectstorage.ap-seoul-1.oraclecloud.com&region=ap-seoul-1&s3ForcePathStyle=true
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_KEY }}
      PULUMI_FALLBACK_TO_STATE_SECRETS_MANAGER: "true"
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact dev head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head_sha="$(git rev-parse HEAD)"
          origin_dev_sha="$(git ls-remote --exit-code origin refs/heads/dev | cut -f1)"
          if [[ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" || "$origin_dev_sha" != "$EXPECTED_HEAD_SHA" ]]; then
            printf 'RECONCILE_FAILURE_STAGE: CHECKOUT_VERIFICATION\n'
            exit 1
          fi
          printf 'RECONCILE_STAGE: CHECKOUT_VERIFIED\n'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.276.0
      - name: Reconcile imported state
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          readonly TAILNET_URN="urn:pulumi:main::platform::tailscale:index/tailnetKey:TailnetKey::main"
          readonly INSTANCE_URN="urn:pulumi:main::platform::oci:Core/instance:Instance::main"
          readonly PUBLIC_IP_URN="urn:pulumi:main::platform::oci:Core/publicIp:PublicIp::main"
          readonly NLB_URN="urn:pulumi:main::platform::oci:NetworkLoadBalancer/networkLoadBalancer:NetworkLoadBalancer::main"

          tmp="$(mktemp -d "${RUNNER_TEMP}/reconcile-state.XXXXXX")"
          backup="$tmp/backup.json"
          mutated=0
          stage="INITIALIZE"

          log_stage() {
            stage="$1"
            printf 'RECONCILE_STAGE: %s\n' "$stage"
          }

          cleanup() {
            status=$?
            trap - EXIT INT TERM
            set +e

            if [[ "$status" -ne 0 ]]; then
              printf 'RECONCILE_FAILURE_STAGE: %s\n' "$stage"
            fi

            if [[ "$mutated" == 1 ]]; then
              printf 'RECONCILE_ROLLBACK: STARTED\n'
              rollback_state="$tmp/rollback.json"
              if pulumi stack import \
                --stack main --file "$backup" --non-interactive --color never \
                >/dev/null 2>&1 &&
                pulumi stack export \
                  --stack main --file "$rollback_state" --non-interactive --color never \
                  >/dev/null 2>&1 &&
                jq -e \
                  --arg tailnet "$TAILNET_URN" \
                  --arg instance "$INSTANCE_URN" \
                  --arg nlb "$NLB_URN" '
                    [.deployment.resources[]
                     | select(.type != "pulumi:pulumi:Stack" and
                              (.type | startswith("pulumi:providers:") | not))] as $custom
                    | [.deployment.resources[] | select(.urn == $nlb)] as $nlbs
                    | ($custom | length) == 51 and
                      ([$custom[] | select(.urn == $tailnet or .urn == $instance)] | length) == 0 and
                      ($nlbs | length) == 1 and
                      (($nlbs[0].inputs // {}) | has("reservedIps") | not)
                  ' "$rollback_state" >/dev/null 2>&1; then
                printf 'RECONCILE_ROLLBACK: SUCCEEDED\n'
              else
                printf 'RECONCILE_ROLLBACK: FAILED\n'
                status=1
              fi
            fi

            rm -rf -- "$tmp"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT TERM

          export AWS_CONFIG_FILE="$tmp/aws-config"
          export AWS_DEFAULT_REGION="ap-seoul-1"
          export AWS_EC2_METADATA_DISABLED="true"
          export AWS_PAGER=""
          export AWS_REQUEST_CHECKSUM_CALCULATION="when_required"
          export AWS_RESPONSE_CHECKSUM_VALIDATION="when_required"
          export PULUMI_HOME="$tmp/pulumi-home"
          printf '[default]\nregion = ap-seoul-1\ns3 =\n  addressing_style = path\n' >"$AWS_CONFIG_FILE"

          log_stage "FETCH_TERRAFORM_STATE"
          raw="$tmp/terraform.tfstate"
          aws s3api get-object \
            --bucket platform-state \
            --key terraform.tfstate \
            --endpoint-url https://cnm7patunz1z.compat.objectstorage.ap-seoul-1.oraclecloud.com \
            --region ap-seoul-1 \
            "$raw" >/dev/null 2>&1

          log_stage "VALIDATE_TERRAFORM_STATE"
          jq -e '
            def instances($type; $name):
              [.resources[]
               | select(.mode == "managed" and .type == $type and .name == $name)
               | .instances[]];
            .lineage == "50a9f199-85b9-7fd2-ecfb-e6feb60a4908" and
            .serial == 157 and
            (instances("tailscale_tailnet_key"; "main") | length) == 1 and
            (instances("oci_core_instance"; "main") | length) == 1 and
            (instances("oci_core_public_ip"; "main") | length) == 1 and
            (instances("oci_network_load_balancer_network_load_balancer"; "main") | length) == 1 and
            (instances("tailscale_tailnet_key"; "main")[0].attributes.id | type == "string" and length > 0) and
            (instances("oci_core_instance"; "main")[0].attributes.id | type == "string" and length > 0) and
            (instances("oci_core_public_ip"; "main")[0].attributes.id | type == "string" and length > 0) and
            (instances("oci_network_load_balancer_network_load_balancer"; "main")[0].attributes.id | type == "string" and length > 0) and
            (instances("oci_network_load_balancer_network_load_balancer"; "main")[0].attributes.reserved_ips | length) == 1 and
            (instances("oci_network_load_balancer_network_load_balancer"; "main")[0].attributes.reserved_ips[0].id ==
             instances("oci_core_public_ip"; "main")[0].attributes.id)
          ' "$raw" >/dev/null

          tailnet_id="$(jq -er '[.resources[] | select(.mode == "managed" and .type == "tailscale_tailnet_key" and .name == "main") | .instances[].attributes.id][0]' "$raw")"
          instance_id="$(jq -er '[.resources[] | select(.mode == "managed" and .type == "oci_core_instance" and .name == "main") | .instances[].attributes.id][0]' "$raw")"
          nlb_id="$(jq -er '[.resources[] | select(.mode == "managed" and .type == "oci_network_load_balancer_network_load_balancer" and .name == "main") | .instances[].attributes.id][0]' "$raw")"
          public_ip_id="$(jq -er '[.resources[] | select(.mode == "managed" and .type == "oci_core_public_ip" and .name == "main") | .instances[].attributes.id][0]' "$raw")"

          log_stage "LOGIN_PULUMI_BACKEND"
          pulumi login "$PULUMI_BACKEND_URL" --non-interactive >/dev/null 2>&1

          log_stage "BACKUP_PULUMI_STATE"
          pulumi stack export \
            --stack main --file "$backup" --non-interactive --color never \
            >/dev/null
          chmod 0600 "$backup"

          log_stage "VALIDATE_BASELINE_STATE"
          jq -e \
            --arg tailnet "$TAILNET_URN" \
            --arg instance "$INSTANCE_URN" \
            --arg nlb "$NLB_URN" \
            --arg nlb_id "$nlb_id" \
            --arg public_ip "$PUBLIC_IP_URN" \
            --arg public_ip_id "$public_ip_id" '
              [.deployment.resources[] | select(.urn == $nlb)] as $nlbs
              | [.deployment.resources[] | select(.urn == $public_ip)] as $public_ips
              | [.deployment.resources[]
                 | select(.type != "pulumi:pulumi:Stack" and
                          (.type | startswith("pulumi:providers:") | not))] as $custom
              | ($custom | length) == 51 and
                ($nlbs | length) == 1 and
                ($public_ips | length) == 1 and
                ([.deployment.resources[] | select(.urn == $tailnet or .urn == $instance)] | length) == 0 and
                $nlbs[0].id == $nlb_id and
                $public_ips[0].id == $public_ip_id and
                (($nlbs[0].inputs // {}) | has("reservedIps") | not) and
                (($nlbs[0].outputs.reservedIps // []) as $reserved
                 | ($reserved | type) == "array" and
                   (($reserved | length) == 0 or
                    (($reserved | length) == 1 and $reserved[0].id == $public_ip_id)))
            ' "$backup" >/dev/null

          log_stage "BUILD_NLB_PATCH"
          patched="$tmp/patched.json"
          jq \
            --arg nlb "$NLB_URN" \
            --arg public_ip "$PUBLIC_IP_URN" \
            --arg public_ip_id "$public_ip_id" '
              .deployment.resources |= map(
                if .urn == $nlb then
                  .inputs.reservedIps = [{id: $public_ip_id}]
                  | .outputs.reservedIps = [{id: $public_ip_id}]
                  | .propertyDependencies = (.propertyDependencies // {})
                  | .propertyDependencies.reservedIps = [$public_ip]
                else . end)
            ' "$backup" >"$patched"

          log_stage "VALIDATE_NLB_PATCH_SCOPE"
          python3 - "$backup" "$patched" "$NLB_URN" <<'PY'
          import copy
          import json
          import sys

          def without_patch(document, urn):
              result = copy.deepcopy(document)
              resources = [item for item in result["deployment"]["resources"] if item["urn"] == urn]
              if len(resources) != 1:
                  raise SystemExit("expected exactly one NLB resource")
              resource = resources[0]
              resource.get("inputs", {}).pop("reservedIps", None)
              resource.get("outputs", {}).pop("reservedIps", None)
              dependencies = resource.get("propertyDependencies", {})
              dependencies.pop("reservedIps", None)
              if not dependencies:
                  resource.pop("propertyDependencies", None)
              return result

          before = json.load(open(sys.argv[1]))
          after = json.load(open(sys.argv[2]))
          if without_patch(before, sys.argv[3]) != without_patch(after, sys.argv[3]):
              raise SystemExit("unexpected checkpoint change")
          PY
          jq -e \
            --arg nlb "$NLB_URN" \
            --arg public_ip "$PUBLIC_IP_URN" \
            --arg public_ip_id "$public_ip_id" '
              [.deployment.resources[] | select(.urn == $nlb)] as $resources
              | ($resources | length) == 1 and
                $resources[0].inputs.reservedIps == [{id: $public_ip_id}] and
                $resources[0].outputs.reservedIps == [{id: $public_ip_id}] and
                $resources[0].propertyDependencies.reservedIps == [$public_ip]
            ' "$patched" >/dev/null

          log_stage "APPLY_NLB_PATCH"
          mutated=1
          pulumi stack import \
            --stack main --file "$patched" --non-interactive --color never \
            >/dev/null 2>&1
          printf 'RECONCILE_SUCCESS_STAGE: NLB_PATCH_APPLIED\n'

          export PULUMI_IMPORT_TAILNET_KEY_ID="$tailnet_id"
          export PULUMI_IMPORT_INSTANCE_ID="$instance_id"

          log_stage "PREVIEW_IMPORT_PLAN"
          preview="$tmp/import-preview.json"
          plan="$tmp/import-plan.json"
          pulumi preview \
            --stack main --json --save-plan "$plan" \
            --target "$TAILNET_URN" --target "$INSTANCE_URN" \
            --parallel 1 --suppress-outputs --suppress-progress \
            --suppress-permalink=true --non-interactive --color never >"$preview"

          log_stage "VALIDATE_IMPORT_PLAN"
          jq -e \
            --arg tailnet "$TAILNET_URN" \
            --arg instance "$INSTANCE_URN" '
              (.changeSummary.import // 0) == 2 and
              (.changeSummary.same // 0) == 52 and
              ([.changeSummary | to_entries[]
                | select(.key != "import" and .key != "same" and .value != 0)] | length) == 0 and
              ([.steps[] | select(.op == "import") | .urn] | unique | sort) == ([$tailnet, $instance] | sort) and
              ([.steps[] | select(.op != "import" and .op != "same")] | length) == 0 and
              ([.diagnostics[]? | select(.severity == "error")] | length) == 0
            ' "$preview" >/dev/null
          printf 'RECONCILE_SUCCESS_STAGE: IMPORT_PLAN_VALIDATED\n'

          log_stage "APPLY_IMPORT_PLAN"
          update="$tmp/import-update.jsonl"
          pulumi up \
            --stack main --yes --json --plan "$plan" \
            --target "$TAILNET_URN" --target "$INSTANCE_URN" \
            --parallel 1 --suppress-outputs --suppress-progress \
            --suppress-permalink=true --non-interactive --color never >"$update"

          log_stage "VALIDATE_IMPORT_UPDATE"
          jq -s -e '
            ([.[] | select(.summaryEvent != null) | .summaryEvent.resourceChanges] | last) as $changes
            | ($changes.import // 0) == 2 and
              ($changes.same // 0) == 52 and
              ([$changes | to_entries[]
                | select(.key != "import" and .key != "same" and .value != 0)] | length) == 0
          ' "$update" >/dev/null
          printf 'RECONCILE_SUCCESS_STAGE: IMPORTS_APPLIED\n'

          unset PULUMI_IMPORT_TAILNET_KEY_ID PULUMI_IMPORT_INSTANCE_ID

          log_stage "FINAL_PREVIEW"
          final_preview="$tmp/final-preview.json"
          pulumi preview \
            --stack main --json --expect-no-changes --parallel 1 \
            --suppress-outputs --suppress-progress --suppress-permalink=true \
            --non-interactive --color never >"$final_preview"

          log_stage "VALIDATE_FINAL_PREVIEW"
          jq -e '
            (.changeSummary.same // 0) == 54 and
            ([.changeSummary | to_entries[]
              | select(.key != "same" and .value != 0)] | length) == 0 and
            ([.steps[] | select(.op != "same")] | length) == 0 and
            ([.diagnostics[]? | select(.severity == "error")] | length) == 0
          ' "$final_preview" >/dev/null
          printf 'RECONCILE_SUCCESS_STAGE: FINAL_PREVIEW_54_SAME\n'

          log_stage "EXPORT_FINAL_STATE"
          final="$tmp/final.json"
          pulumi stack export \
            --stack main --file "$final" --non-interactive --color never \
            >/dev/null

          log_stage "VALIDATE_FINAL_STATE"
          jq -e \
            --arg tailnet "$TAILNET_URN" \
            --arg tailnet_id "$tailnet_id" \
            --arg instance "$INSTANCE_URN" \
            --arg instance_id "$instance_id" '
              [.deployment.resources[]
               | select(.type != "pulumi:pulumi:Stack" and
                        (.type | startswith("pulumi:providers:") | not))] as $custom
              | ($custom | length) == 53 and
                ([$custom[] | select(.urn == $tailnet and .id == $tailnet_id)] | length) == 1 and
                ([$custom[] | select(.urn == $instance and .id == $instance_id)] | length) == 1
            ' "$final" >/dev/null

          mutated=0
          stage="COMPLETED"
          printf 'RECONCILE_RESULT: SUCCEEDED\n'
