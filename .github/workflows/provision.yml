on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: pulumi/actions@v7
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.REGION }}
          OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.USER_OCID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_KEY }}
          PULUMI_FALLBACK_TO_STATE_SECRETS_MANAGER: "true"
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        with:
          command: preview
          stack-name: main
          pulumi-version: 3.276.0
          upsert: true
      - name: Import frozen Terraform state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-seoul-1
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_PAGER: ""
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OCI_FINGERPRINT: ${{ secrets.FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.REGION }}
          OCI_TENANCY_OCID: ${{ secrets.TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.USER_OCID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_KEY }}
          PULUMI_FALLBACK_TO_STATE_SECRETS_MANAGER: "true"
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d "${RUNNER_TEMP}/terraform-pulumi-import.XXXXXX")"
          trap 'rm -rf "$tmp"' EXIT
          before="$tmp/before.json"
          after="$tmp/after.json"
          raw="$tmp/terraform.tfstate"
          filtered="$tmp/terraform.filtered.tfstate"
          [[ "$(pulumi version)" == "v3.276.0" ]]
          pulumi stack export \
            --stack main --file "$before" --non-interactive --color never
          custom_count="$(jq '[.deployment.resources[]?
            | select(.type != "pulumi:pulumi:Stack" and
                     (.type | startswith("pulumi:providers:") | not))]
            | length' "$before")"
          summary() {
            cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          ### Terraform to Pulumi import
          - Imported: **49** protected resources ($1)
          - Excluded: backend bucket, write-only OCI credential, ephemeral Tailscale key, legacy Coolify VM
          EOF
          }
          # The count guard makes repeat workflow runs safe; pulumi import itself is not idempotent.
          if [[ "$custom_count" == 49 ]]; then
            summary "already complete"
            exit 0
          elif [[ "$custom_count" != 0 ]]; then
            echo "::error::Unexpected partial Pulumi state"
            exit 1
          fi
          pulumi plugin install converter terraform 1.4.0 --exact
          pulumi plugin install resource cloudflare 6.24.0 --exact
          pulumi plugin install resource oci 5.7.0 --exact
          pulumi plugin install resource tailscale 0.30.0 --exact
          [[ "$(aws --version 2>&1)" == aws-cli/2.* ]]
          export AWS_CONFIG_FILE="$tmp/aws-config"
          printf '[default]\nregion = ap-seoul-1\ns3 =\n  addressing_style = path\n' \
            >"$AWS_CONFIG_FILE"
          aws s3api get-object \
            --bucket platform-state --key terraform.tfstate \
            --endpoint-url https://cnm7patunz1z.compat.objectstorage.ap-seoul-1.oraclecloud.com \
            --region ap-seoul-1 "$raw" >/dev/null
          excluded='["oci_objectstorage_bucket.state","oci_identity_auth_token.application","tailscale_tailnet_key.main","oci_core_instance.main"]'
          jq -e --argjson excluded "$excluded" '
            def address:
              ((.module // "") +
               (if (.module // "") == "" then "" else "." end) +
               .type + "." + .name);
            if .lineage == "50a9f199-85b9-7fd2-ecfb-e6feb60a4908" and
               .serial == 157 and
               ([.resources[] | select(.mode == "managed") | .instances[]]
                | length) == 53
            then . else error("unexpected frozen state") end
            | ([.resources[] | select(.mode == "managed") | address]) as $addresses
            | if (($excluded - $addresses) | length) == 0
              then . else error("required exclusion missing") end
            | .outputs = {}
            | .resources |= map(select(.mode == "managed" and
                (address as $item | $excluded | index($item) == null)))
            | if ([.resources[].instances[]] | length) == 49
              then . else error("unexpected filtered state") end
          ' "$raw" >"$filtered"
          import_flags=(--from terraform "$filtered" --stack main --protect=true
            --generate-code=false --parallel 1 --suppress-outputs --suppress-progress
            --suppress-permalink=true --non-interactive --color never)
          pulumi import "${import_flags[@]}" --preview-only
          rollback() {
            status=$?
            trap - ERR
            set +e
            pulumi stack import \
              --stack main --file "$before" --non-interactive --color never
            exit "$status"
          }
          trap rollback ERR
          pulumi import "${import_flags[@]}" --yes
          pulumi stack export \
            --stack main --file "$after" --non-interactive --color never
          jq -e '[.deployment.resources[]
            | select(.type != "pulumi:pulumi:Stack" and
                     (.type | startswith("pulumi:providers:") | not))] as $resources
            | ($resources | length) == 49 and
              all($resources[]; .protect == true)' "$after" >/dev/null
          trap - ERR
          summary "completed now"
